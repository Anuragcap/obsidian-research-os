name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: bash -n bin/obs lib/*.sh install.sh
      - name: Check Python syntax
        run: python3 -m py_compile vault_ops.py calendar_sync.py focus_timer.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
